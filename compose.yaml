services:
  planviewer:
    build: .
    image: planviewer
    restart: unless-stopped
    # Transcripts are mode 0600; on Linux hosts the container must run as their owner
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - "${PLANS_DIR:-~/.claude/plans}:/plans:ro"
      - "${PROJECTS_DIR:-~/.claude/projects}:/projects:ro"
