services:
  planviewer:
    build: .
    image: planviewer
    restart: unless-stopped
    command: ["-cache-dir=", "-agy-dir=/agy"]
    # Transcripts are mode 0600; on Linux hosts the container must run as their owner
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - "${CLAUDE_CONFIG_DIR:-~/.claude}/plans:/claude/plans:ro"
      - "${CLAUDE_CONFIG_DIR:-~/.claude}/projects:/claude/projects:ro"
      - "${CODEX_HOME:-~/.codex}/sessions:/codex/sessions:ro"
      - "${CODEX_HOME:-~/.codex}/session_index.jsonl:/codex/session_index.jsonl:ro"
      - "~/.gemini/antigravity-cli/brain:/agy/brain:ro"
      - "~/.gemini/antigravity-cli/cache:/agy/cache:ro"
      - "~/.gemini/antigravity-cli/annotations:/agy/annotations:ro"
      - "~/.gemini/antigravity-cli/history.jsonl:/agy/history.jsonl:ro"
