services:
  planviewer:
    build: .
    image: planviewer
    restart: unless-stopped
    # Transcripts are mode 0600; on Linux hosts the container must run as their owner
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - "${CLAUDE_CONFIG_DIR:-~/.claude}/plans:/claude/plans:ro"
      - "${CLAUDE_CONFIG_DIR:-~/.claude}/projects:/claude/projects:ro"
