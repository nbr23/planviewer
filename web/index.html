<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body data-kind="{{.Kind}}"{{if not .Transcripts}} class="no-project"{{end}}>
<header class="bar">
  <nav class="modes" aria-label="Lists">
    <a href="/"{{if eq .Kind "plans"}} aria-current="page"{{end}}>Plans</a>
    {{- if .Transcripts}}
    <a href="/sessions"{{if eq .Kind "sessions"}} aria-current="page"{{end}}>Sessions</a>
    {{- end}}
  </nav>
  <input id="q" type="search" placeholder="{{.Placeholder}}" aria-label="Search {{.Kind}}" autocomplete="off" spellcheck="false" autofocus>
  <span id="count" class="muted"></span>
</header>
<main class="list">
  <table id="items">
    <thead>
      <tr>
        <th class="col-title"><button type="button" data-sort="title">Title</button></th>
        <th class="col-project"><button type="button" data-sort="project">Project</button></th>
        <th class="col-date"><button type="button" data-sort="created">Created</button></th>
        <th class="col-date"><button type="button" data-sort="updated">Updated</button></th>
        <th class="col-size"><button type="button" data-sort="{{.CountKey}}">{{.CountLabel}}</button></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="empty" class="muted" hidden>No {{.Kind}} match.</p>
</main>
</body>
</html>
